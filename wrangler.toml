name = "wavelengthz"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Powers `wrangler tail` / the dashboard's Logs > Live view against the
# deployed Worker -- src/lib/spotify.ts's spotifyFetch logs a structured
# `spotify_call` entry for every outbound Spotify request (web, the backfill
# queue consumer, the deck top-up job, the admin seed script all funnel
# through it), filterable via `wrangler tail --search spotify_call`.
# head_sampling_rate=1 captures 100% of invocations -- appropriate while
# actively debugging Spotify rate-limit collisions; dial back if log volume
# becomes a cost/noise concern once things stabilize. Retention is 3 days on
# the free plan / 7 days on paid, so this is a live-debugging tool, not an
# archive.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "wavelengthz-db"
database_id = "2cceb37f-f22e-44ee-a015-b14b062ebc4e"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wavelengthz-photos"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "9234707e75a842fbafb19e20911148d4"

[assets]
directory = "./public"
binding = "ASSETS"
# Routes every request (static assets included) through this Worker's fetch
# handler first, rather than Cloudflare serving public/ directly -- required
# for the pre-launch password gate in src/index.ts to actually cover the
# whole site instead of only /api/* routes.
run_worker_first = true

[vars]
# isAllowedHost() (src/routes/auth.ts) treats this var's own host as always
# allowed, and bounces any other host straight to it -- so leaving this as
# the localhost dev value meant production (wavelengthz.com) failed
# isAllowedHost's check against its own canonical domain and redirected
# every real visitor's /login/spotify to their own 127.0.0.1:8787 instead of
# completing OAuth. This file's top-level [vars] block is what
# `wrangler deploy` (no --env) ships to production, so it must be the
# production URL here; override to the localhost value in a personal
# (gitignored) .dev.vars for local dev.
SPOTIFY_REDIRECT_URI = "https://wavelengthz.com/callback"
# Unlike SPOTIFY_REDIRECT_URI (only ever a fallback -- /login and /callback
# compute the real redirect_uri per-request via callbackUrlForHost), Google's
# flow has no host-based override by design (no Cloudflare Tunnel/multi-host
# support for Google -- see the Global Constraints in
# docs/superpowers/plans/2026-08-08-google-signon.md). This value is used
# verbatim by /login/google and /callback/google, and this file's top-level
# [vars] block is what `wrangler deploy` (no --env) ships to production --
# so it must be the production URL here. Override to the localhost value in
# a personal (gitignored) .dev.vars for local dev.
GOOGLE_REDIRECT_URI = "https://wavelengthz.com/callback/google"
# Extra hosts (comma-separated, no scheme -- "host:port" or "host") that
# /login and /callback (src/routes/auth.ts) will serve OAuth directly on,
# rather than redirecting to SPOTIFY_REDIRECT_URI's host first. Each one
# still needs its own "<scheme>://<host>/callback" registered as a valid
# redirect URI in the Spotify Developer Dashboard -- Spotify enforces an
# exact-match allowlist of its own regardless of anything here, so this
# can't be used to send an OAuth flow anywhere Spotify wasn't already told
# to trust. Empty by default; override in a personal (gitignored) .dev.vars
# for things like a Cloudflare Tunnel hostname when testing on a real phone
# -- e.g. SPOTIFY_ALLOWED_HOSTS=local.wavelengthz.com.
SPOTIFY_ALLOWED_HOSTS = ""
# Invite-only signup gate (docs/superpowers/specs/2026-08-09-gender-balanced-
# invite-gate-design.md). Off by default -- signup stays fully open until
# this is deliberately flipped on, at the same moment SITE_BASIC_AUTH_* comes
# off. Any non-empty value turns it on; src/routes/auth.ts's new-user
# branches are the only place this is checked.
INVITE_ONLY = ""
# How long a new match stays hidden from passive-discovery surfaces (Matches
# list, profile isMatch badge, notification bell/email) -- src/lib/
# notifications.ts's getMatchNotificationDelayMs(). Minutes, not ms, for a
# human-editable config value.
MATCH_NOTIFICATION_DELAY_MINUTES = "5"
# The frontend fetches this via GET /api/push/vapid-public-key to pass as
# pushManager.subscribe()'s applicationServerKey -- it's not secret, the
# browser receives it directly. VAPID_PRIVATE_KEY/VAPID_SUBJECT (the matching
# private scalar + contact mailto: RFC 8292 requires) are secrets, set via
# `wrangler secret put`, never committed. This value is real (generated for
# this repo, not a placeholder), but it's only half of a usable keypair --
# push sends will fail (importVapidPrivateKey in src/lib/webPush.ts throws)
# until VAPID_PRIVATE_KEY is also set via `wrangler secret put
# VAPID_PRIVATE_KEY` for whichever account this actually deploys to.
VAPID_PUBLIC_KEY = "BCwiQZeDBv-OpwX4qhUY1jF3prRgwPUiU2HVe1ZuVGv6GQG08tyYXCgqFWNAZEY7Z-9mzM29AFkP9hbsVxdG2LA"

[[queues.producers]]
# Enqueued right after a brand-new artist is inserted (see upsertArtist's
# callers) so genre enrichment can start within seconds/minutes instead of
# waiting for the hourly cron sweep (genreEnrichment.ts) -- that sweep stays
# in place as the backstop for anything a queue message doesn't cover (a
# message that exhausts its retries, or an artist that predates this queue).
queue = "musicbrainz-genre-enrichment"
binding = "GENRE_ENRICHMENT_QUEUE"

[[queues.consumers]]
queue = "musicbrainz-genre-enrichment"
# max_concurrency = 1 is the actual rate-limit safeguard here: MusicBrainz
# allows 1 request/second total, not per consumer instance, so more than one
# concurrent consumer invocation would each independently pace against that
# same limit and blow past it together. A batch is still processed one
# message at a time internally (queueGenreEnrichment.ts) with the same
# per-call delay the hourly cron uses.
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
max_concurrency = 1

[[queues.producers]]
# Enqueued by GET /api/artists/:id (src/routes/catalog.ts) whenever a
# first-time view (no ?limit=) has no cached full track list yet and falls
# back to the quick path (fetchArtistTracksQuick, src/lib/spotify.ts) --
# see src/lib/artistTrackBackfill.ts for why: that quick fetch deliberately
# leaves most of the artist's discography unfetched, and this queue is what
# completes it off the request path instead of synchronously, which is what
# was tripping Spotify's own rate limit under real load (see fetchArtistTracks'
# own comment in spotify.ts for the ~40-call fan-out this replaces on the hot
# path).
queue = "artist-track-backfill"
binding = "ARTIST_TRACK_BACKFILL_QUEUE"

[[queues.consumers]]
queue = "artist-track-backfill"
# max_concurrency = 1, and messages within a batch are processed one at a
# time (processArtistTrackBackfillBatch) -- each individual backfill job
# already fans out to ~40 Spotify calls (bounded by TRACK_FETCH_CONCURRENCY/
# ALBUM_TRACKS_FETCH_CONCURRENCY = 5 concurrent at a time, src/lib/spotify.ts),
# so running several different artists' backfills at once would just
# reintroduce the same burst-size problem this whole feature exists to fix.
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
max_concurrency = 1

[triggers]
# "0 3 * * *": nightly purgeExpiredDeletions. "0 4 * * sun": weekly catalog
# refresh -- Cloudflare's day-of-week is 1=Sunday..7=Saturday, NOT the usual
# 0=Sunday..6=Saturday, so the numeric form (e.g. "0") is a different day
# than it looks and can even be rejected outright as out of range; the
# 3-letter name Cloudflare itself recommends sidesteps the whole ambiguity.
# "*/5 * * * *": sweeps deferred match-notification emails (MATCH_NOTIFICATION_DELAY_MINUTES above).
# "0 * * * *": hourly MusicBrainz genre enrichment (genreEnrichment.ts) --
# on the hour so an artist added right after one run has to wait at most
# ~an hour, not longer, to get picked up by the next.
# "30 */6 * * *": artist-only catalog discovery (src/lib/catalogDiscovery.ts).
# Every 6 hours rather than hourly because each run only walks a few genres
# and the catalog has no urgency; at :30 specifically so it never lands on
# the same minute as the hourly genre enrichment above and contend with it
# for the same Spotify/MusicBrainz budget. This is the only scheduled job
# that grows the catalog unattended -- the weekly refresh above can only add
# artists already present in some user's Spotify top-artists list, which on
# a small user base runs dry after its first run.
# "15 * * * *": hourly Spotify write sync for users who opted in -- playlist
# sync (src/lib/playlistSync.ts) then follow sync (src/lib/followSync.ts),
# chained rather than parallel so the two don't double the write burst. Hourly is deliberate rather than every-few-minutes: a
# liked song showing up in someone's playlist within the hour is well within
# what anyone would expect, and these are *write* calls against the same
# app-wide Spotify limit everything else shares. At :15 so it collides with
# neither the hourly genre enrichment (:00) nor catalog discovery (:30).
crons = ["0 3 * * *", "0 4 * * sun", "*/5 * * * *", "0 * * * *", "30 */6 * * *", "15 * * * *"]

[env.test]
[[env.test.d1_databases]]
binding = "DB"
database_name = "wavelengthz-db-test"
database_id = "test-id"

[[env.test.r2_buckets]]
binding = "PHOTOS"
bucket_name = "wavelengthz-photos-test"

[[env.test.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "test-kv-id"

[[env.test.queues.producers]]
queue = "musicbrainz-genre-enrichment-test"
binding = "GENRE_ENRICHMENT_QUEUE"

[[env.test.queues.consumers]]
queue = "musicbrainz-genre-enrichment-test"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
max_concurrency = 1

[[env.test.queues.producers]]
queue = "artist-track-backfill-test"
binding = "ARTIST_TRACK_BACKFILL_QUEUE"

[[env.test.queues.consumers]]
queue = "artist-track-backfill-test"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
max_concurrency = 1

