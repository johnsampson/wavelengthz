name = "wavelengthz"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "wavelengthz-db"
database_id = "REPLACE_WITH_REAL_ID_AFTER_wrangler_d1_create"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wavelengthz-photos"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_REAL_ID_AFTER_wrangler_kv_namespace_create"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
SPOTIFY_REDIRECT_URI = "http://localhost:8787/callback"

[triggers]
crons = ["0 3 * * *", "0 4 * * 0"]

[env.test]
[[env.test.d1_databases]]
binding = "DB"
database_name = "wavelengthz-db-test"
database_id = "test-id"

[[env.test.r2_buckets]]
binding = "PHOTOS"
bucket_name = "wavelengthz-photos-test"

[[env.test.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "test-kv-id"

[env.test.vars]
SPOTIFY_REDIRECT_URI = "http://localhost:8787/callback"
SPOTIFY_CLIENT_ID = "test-client-id"
SPOTIFY_CLIENT_SECRET = "test-client-secret"
TOKEN_ENCRYPTION_KEY = "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
SEED_SECRET = "test-seed-secret"
R2_ACCOUNT_ID = "test-account-id"
R2_ACCESS_KEY_ID = "test-access-key-id"
R2_SECRET_ACCESS_KEY = "test-secret-access-key"
R2_BUCKET_NAME = "wavelengthz-photos-test"
RESEND_API_KEY = "test-resend-api-key"
RESEND_FROM_ADDRESS = "matches@wavelengthz.app"
SENTRY_DSN = "https://testpublickey@o0.ingest.sentry.io/0"
