name = "wavelengthz"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "wavelengthz-db"
database_id = "2cceb37f-f22e-44ee-a015-b14b062ebc4e"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "wavelengthz-photos"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "9234707e75a842fbafb19e20911148d4"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# Routes every request (static assets included) through this Worker's fetch
# handler first, rather than Cloudflare serving public/ directly -- required
# for the pre-launch password gate in src/index.ts to actually cover the
# whole site instead of only /api/* routes.
run_worker_first = true

[vars]
SPOTIFY_REDIRECT_URI = "http://127.0.0.1:8787/callback"
# How long a new match stays hidden from passive-discovery surfaces (Matches
# list, profile isMatch badge, notification bell/email) -- src/lib/
# notifications.ts's getMatchNotificationDelayMs(). Minutes, not ms, for a
# human-editable config value.
MATCH_NOTIFICATION_DELAY_MINUTES = "5"
# Kill switch for the scheduled artist-catalog-growth job (src/lib/
# catalogGrowth.ts's runCatalogGrowthJob) -- set to "false" (via `wrangler
# secret put` or the dashboard) to pause it without a code deploy. Unset or
# any other value means enabled.
ARTIST_CATALOG_GROWTH_ENABLED = "true"

[triggers]
# "0 3 * * *": nightly purgeExpiredDeletions. "0 4 * * sun": weekly catalog
# refresh. "*/5 * * * *": sweeps deferred match-notification emails
# (MATCH_NOTIFICATION_DELAY_MINUTES above). "*/15 * * * *": artist catalog
# growth (src/lib/catalogGrowth.ts's runCatalogGrowthJob). "0 13 * * *":
# daily artist catalog growth digest email (sendCatalogGrowthDigest).
crons = ["0 3 * * *", "0 4 * * sun", "*/5 * * * *", "*/15 * * * *", "0 13 * * *"]

[env.test]
[[env.test.d1_databases]]
binding = "DB"
database_name = "wavelengthz-db-test"
database_id = "test-id"

[[env.test.r2_buckets]]
binding = "PHOTOS"
bucket_name = "wavelengthz-photos-test"

[[env.test.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "test-kv-id"

[env.test.vars]
SPOTIFY_REDIRECT_URI = "http://127.0.0.1:8787/callback"
MATCH_NOTIFICATION_DELAY_MINUTES = "5"
SPOTIFY_CLIENT_ID = "test-client-id"
SPOTIFY_CLIENT_SECRET = "test-client-secret"
TOKEN_ENCRYPTION_KEY = "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
SEED_SECRET = "test-seed-secret"
R2_ACCOUNT_ID = "test-account-id"
R2_ACCESS_KEY_ID = "test-access-key-id"
R2_SECRET_ACCESS_KEY = "test-secret-access-key"
R2_BUCKET_NAME = "wavelengthz-photos-test"
RESEND_API_KEY = "test-resend-api-key"
RESEND_FROM_ADDRESS = "matches@wavelengthz.app"
SENTRY_DSN = "https://testpublickey@o0.ingest.sentry.io/0"
ARTIST_CATALOG_GROWTH_ENABLED = "true"
OPS_ALERT_EMAIL = "ops@example.com"
