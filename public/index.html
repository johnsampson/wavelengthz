<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wavelengthz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body class="min-h-dvh bg-base text-neutral-50 pb-app">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()" x-init="init()">
  <header class="flex flex-col items-center gap-3 pb-3">
    <div class="flex items-center gap-2 rounded-full bg-surface2 p-1" x-show="authed === true">
      <button
        class="pill-toggle"
        :class="mode === 'music' ? 'pill-toggle-active' : 'pill-toggle-inactive'"
        @click="setMode('music')"
        :aria-pressed="mode === 'music'"
      >Music</button>
      <button
        class="pill-toggle"
        :class="mode === 'people' ? 'pill-toggle-active' : 'pill-toggle-inactive'"
        @click="setMode('people')"
        :aria-pressed="mode === 'people'"
      >People</button>
    </div>
  </header>

  <main class="flex flex-col items-center gap-8 px-4">
    <div x-show="authed === false" class="card flex w-full max-w-sm flex-col items-center gap-3 px-6 py-12 text-center">
      <span class="text-3xl">🎧</span>
      <p class="font-semibold text-neutral-100">Find your wavelength</p>
      <p class="text-sm text-neutral-400">Log in to start swiping on people and music.</p>
      <a href="/login" class="btn-primary mt-2 w-full">Log in</a>
    </div>

    <div
      id="deck-container"
      class="relative aspect-square w-full max-w-sm"
      x-show="authed === true && current"
    >
      <article class="card absolute inset-0 overflow-hidden rounded-3xl" id="card">
        <!-- People-mode candidates can have no photo at all now that
             onboarding photos are optional (issue #108) -- primaryPhotoUrl
             is null in that case, so guard with x-if rather than always
             rendering an <img> (a bare :src="null" just drops the src
             attribute, leaving an empty box; skipping the element entirely
             falls back to the card's own bg-surface, same as the member
             face stack in group.html). -->
        <template x-if="mode === 'music' ? current?.imageUrl : current?.primaryPhotoUrl">
          <img :src="mode === 'music' ? current?.imageUrl : current?.primaryPhotoUrl" :alt="current?.name || current?.displayName || 'candidate photo'" class="absolute inset-0 h-full w-full object-cover" />
        </template>
        <!-- pointerdown.stop: without it this bubbles to #card and
             attachSwipeDeck's own pointerdown listener starts a drag capture,
             which swallows the button's click entirely. Deliberately
             tap-to-play, not autoplay-on-card-appear: most mobile browsers
             block unmuted autoplay without a gesture anyway, and firing
             sound on every card swiped past would be disruptive regardless.
             Playback itself now happens in the fixed player bar
             (public/playerBar.js) above the bottom nav, not inline here --
             this chip just hands off to it and reflects whether this
             track is the one currently playing there. -->
        <button
          type="button"
          x-show="current?.anthemTrack"
          class="absolute right-3 top-3 z-10 flex max-w-[75%] items-center gap-1.5 rounded-full bg-black/60 px-3 py-1.5 text-xs font-medium text-white backdrop-blur-sm"
          @pointerdown.stop
          @click.stop="toggleAnthem()"
          :aria-label="isCurrentAnthem() ? 'Pause' : `Play ${current?.anthemTrack?.name}`"
        >
          <span aria-hidden="true" x-text="isCurrentAnthem() ? '⏸' : '🎵'"></span>
          <span class="truncate" x-text="current?.anthemTrack?.name"></span>
        </button>
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-5 pt-16">
          <h2 class="text-2xl font-bold">
            <!-- pointerdown.stop/click.stop: same swipe-drag-capture
                 reasoning as the anthem chip above -- without it this
                 bubbles to #card and starts a drag capture instead of
                 registering as a tap. Both modes route to the full
                 view (artist page / profile) via the name itself now;
                 people mode used to have a separate dedicated "view full
                 profile" button below instead (issue #127: "remove the
                 info button and make the match name clickable"). -->
            <button
              type="button"
              class="text-left hover:underline underline-offset-4"
              @pointerdown.stop
              @click.stop="mode === 'music' ? viewArtist() : viewProfile()"
              x-text="mode === 'music' ? current?.name : current?.displayName"
            ></button>
          </h2>
          <!-- issue #159/#160 (part of the 250K-users strategy): the
               artist's most-liked cataloged track, ready to tap without
               leaving the deck -- replaces the old text chip that only
               handed off to the shared player bar. Mounted/torn down
               imperatively by index.js's showCardPreviewEmbed/
               hideCardPreviewEmbed (Spotify's embed has no JS API to
               redirect an existing iframe to a new track, so a track
               change always means a fresh element -- same reasoning as
               playerBar.js's own iframe), not declaratively via x-show,
               since the actual `wl-card-preview-host` div below must
               always exist in this card's markup, empty and hidden
               (`class="hidden"`) as its default rest state, for those
               functions to find. -->
          <div id="wl-card-preview-host" class="mt-2 hidden" @pointerdown.stop @click.stop></div>
          <p class="text-neutral-200" x-text="current?.bio || current?.distanceLabel"></p>
          <!-- Shared chip row: people-mode's own top genres, or (as of the
               music-mode candidates response adding topGenres) an artist
               candidate's genres -- same field, same rendering either way. -->
          <div x-show="current?.topGenres?.length > 0" class="mt-2 flex flex-wrap gap-1.5">
            <template x-for="g in current?.topGenres || []" :key="g">
              <span class="pill-toggle pill-toggle-inactive text-xs" x-text="g"></span>
            </template>
          </div>
        </div>
      </article>
    </div>

    <div x-show="authed === true && !current" class="card flex w-full max-w-sm flex-col items-center gap-2 px-6 py-10 text-center">
      <span class="text-3xl">🌊</span>
      <p class="font-semibold text-neutral-200">No new waves right now</p>
      <p class="text-sm text-neutral-400" x-text="mode === 'music' ? 'Check back later, or search for an artist you like.' : 'Check back later for more matches.'"></p>
      <button
        x-show="mode === 'music'"
        class="btn-secondary mt-2 flex w-full items-center justify-center gap-2"
        @click="openSearch()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        Search for an artist
      </button>
    </div>

    <div class="flex items-center gap-8" x-show="authed === true && current && !matchModal">
      <button
        class="btn-secondary h-16 w-16 rounded-full"
        @click="decide('left')"
        aria-label="Pass"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto h-7 w-7">
          <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17" />
        </svg>
      </button>
      <button
        x-show="mode === 'music'"
        class="btn-secondary h-14 w-14 rounded-full"
        @click="decide('skip')"
        aria-label="Skip -- I don't know this artist, ask me again later"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto h-6 w-6">
          <path d="M5 4l10 8-10 8V4z" />
          <path d="M19 5v14" />
        </svg>
      </button>
      <button
        class="btn-primary h-20 w-20 rounded-full"
        @click="decide('right')"
        aria-label="Like"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-9 w-9">
          <path d="M12 21C2 15 2 10 3 7L7 11L12 7L17 11L21 7C22 10 22 15 12 21Z" />
        </svg>
      </button>
    </div>

    <button
      type="button"
      x-show="authed === true && current && !matchModal && mode === 'music'"
      class="btn-ghost flex items-center gap-1.5 text-sm"
      @click="openSearch()"
      aria-label="Search for an artist"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <circle cx="11" cy="11" r="7" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      Search
    </button>

    <!-- The deck's only discovery surface for /drop (public/drop.html) --
         see that page's own comment for why this isn't a 6th bottom-nav
         tab. Moved below the deck/action-button block entirely (issue
         #127: "let's move the daily drop somewhere else. It's impedes the
         UX of the swiping") -- it used to sit above the deck card, eating
         into the vertical space right where a swipe gesture starts and
         shrinking the card itself. Still on this same page with zero extra
         navigation, just entirely out of the swipe zone now. Hidden
         entirely (not just skeleton-loading) until the fetch
         resolves, so a slow or failed load never shows a stale/wrong
         prompt. -->
    <a
      href="/drop"
      x-show="authed === true && dailyDropPrompt"
      class="card flex w-full max-w-sm items-center gap-3 p-3 text-left transition active:scale-[0.98] active:bg-white/5"
    >
      <span class="text-2xl" aria-hidden="true">🎵</span>
      <span class="min-w-0 flex-1">
        <span class="block text-xs font-semibold uppercase tracking-wide text-brand-400">The Daily Drop</span>
        <span class="block truncate text-sm text-neutral-200" x-text="dailyDropPrompt && dailyDropPrompt.text"></span>
      </span>
      <span
        class="shrink-0 text-xs text-neutral-500"
        x-text="dailyDropPrompt && dailyDropPrompt.answered ? 'Answered' : 'Answer'"
      ></span>
    </a>
  </main>

  <div
    x-ref="searchOverlay"
    x-show="showSearch"
    class="fixed inset-0 z-20 flex flex-col bg-base/95 p-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    :aria-label="searchType === 'track' ? 'Search for a song' : 'Search for an artist'"
  >
    <div class="mx-auto flex w-full max-w-md items-center gap-2">
      <input
        x-ref="searchInput"
        class="field flex-1"
        type="search"
        :placeholder="searchType === 'track' ? 'Search for a song...' : 'Search for an artist...'"
        x-model="searchQuery"
        @input="onSearchInput()"
      />
      <button class="btn-ghost" @click="closeSearch()">Cancel</button>
    </div>
    <!-- issue #108: "I often try to find and like a track and I'm unable
         to" -- search only ever looked up artists by name before this,
         with no way to find a specific song at all. -->
    <div class="mx-auto mt-3 flex w-full max-w-md gap-2 rounded-full bg-surface2 p-1">
      <button
        type="button"
        class="pill-toggle flex-1"
        :class="searchType === 'artist' ? 'pill-toggle-active' : 'pill-toggle-inactive'"
        @click="setSearchType('artist')"
        :aria-pressed="searchType === 'artist'"
      >Artists</button>
      <button
        type="button"
        class="pill-toggle flex-1"
        :class="searchType === 'track' ? 'pill-toggle-active' : 'pill-toggle-inactive'"
        @click="setSearchType('track')"
        :aria-pressed="searchType === 'track'"
      >Songs</button>
    </div>
    <ul class="mx-auto mt-4 flex w-full max-w-md flex-1 min-h-0 flex-col gap-2 overflow-y-auto">
      <template x-if="searchType === 'artist'">
        <template x-for="result in searchResults" :key="result.id || result.spotifyArtistId">
          <li>
            <button class="card flex w-full items-center gap-3 p-3 text-left transition active:scale-[0.98] active:bg-white/5" @click="selectArtist(result)">
              <img :src="result.imageUrl" :alt="result.name" class="h-10 w-10 rounded-full object-cover ring-1 ring-white/10" />
              <span class="text-neutral-100" x-text="result.name"></span>
            </button>
          </li>
        </template>
      </template>
      <!-- Tapping a song likes it immediately (selectTrack, index.js) rather
           than navigating anywhere -- the heart makes that a tap-to-like
           row rather than a tap-to-view one, matching the artist rows'
           lack of one for the opposite reason. -->
      <template x-if="searchType === 'track'">
        <template x-for="result in searchResults" :key="result.id || result.spotifyTrackId">
          <li>
            <button
              class="card flex w-full items-center gap-3 p-3 text-left transition active:scale-[0.98] active:bg-white/5 disabled:pointer-events-none disabled:opacity-50"
              :disabled="likingTrack"
              @click="selectTrack(result)"
            >
              <img :src="result.imageUrl" :alt="result.name" class="h-10 w-10 shrink-0 rounded object-cover ring-1 ring-white/10" />
              <span class="min-w-0 flex-1">
                <span class="block truncate text-neutral-100" x-text="result.name"></span>
                <span class="block truncate text-xs text-neutral-400" x-text="result.artistName"></span>
              </span>
              <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 shrink-0 text-brand-400">
                <path d="M12 21C2 15 2 10 3 7L7 11L12 7L17 11L21 7C22 10 22 15 12 21Z" />
              </svg>
            </button>
          </li>
        </template>
      </template>
    </ul>
    <p x-show="searchQuery.trim().length > 0 && !searching && searchResults.length === 0" class="mx-auto mt-4 w-full max-w-md text-center text-neutral-400">
      <span x-text="searchType === 'track' ? 'No songs found.' : 'No artists found.'"></span>
    </p>
  </div>

  <div
    x-show="matchModal"
    class="fixed inset-0 z-30 flex flex-col items-center justify-center gap-4 bg-base/95 p-6 text-center backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-label="It's a match"
  >
    <!-- Same null-photoUrl guard as the deck card above -- the other user
         may have no photo (photos are optional at onboarding). -->
    <template x-if="matchModal?.photoUrl">
      <img :src="matchModal?.photoUrl" :alt="matchModal?.name" class="h-32 w-32 rounded-full object-cover ring-4 ring-brand-500" />
    </template>
    <h2 class="wordmark text-3xl">It's a match!</h2>
    <p class="text-neutral-300">You and <span x-text="matchModal?.name" class="font-semibold text-neutral-100"></span> liked each other.</p>
    <div class="mt-2 flex w-full max-w-xs flex-col gap-2">
      <a :href="`/messages?matchId=${matchModal?.matchId}`" class="btn-primary">Send a Message</a>
      <button class="btn-secondary" @click="dismissMatch()">Keep Swiping</button>
    </div>
  </div>

  <div
    x-show="genrePrompt"
    class="fixed inset-0 z-30 flex flex-col items-center justify-center gap-4 bg-base/95 p-6 text-center backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    :aria-label="`Hide ${genrePrompt} going forward?`"
  >
    <span class="text-3xl">🙈</span>
    <h2 class="text-xl font-bold">Not into <span x-text="genrePrompt" class="text-brand-400"></span>?</h2>
    <p class="text-neutral-300">You've passed on 10 artists in this genre. Want to stop seeing it in your deck?</p>
    <div class="mt-2 flex w-full max-w-xs flex-col gap-2">
      <button class="btn-primary" @click="blockGenrePrompt()">Hide "<span x-text="genrePrompt"></span>" Going Forward</button>
      <button class="btn-secondary" @click="genrePrompt = null">Keep Showing It</button>
    </div>
  </div>
  </div>

  <script type="module">
    import { mountHeader, mountNav } from '/nav.js';
    import { installTapFeedback } from '/tapFeedback.js';
    import { createDeckApp } from '/index.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    installTapFeedback();
    mountPlayerBar();

    window.pageApp = createDeckApp;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="wl-gpu-layer fixed inset-x-0 z-10" style="bottom: var(--wl-nav-h)">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
