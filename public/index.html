<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wavelengthz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body class="min-h-screen bg-base text-neutral-50 pb-app" x-data="deckApp()" x-init="init()">
  <div id="wl-header-root"></div>
  <header class="flex flex-col items-center gap-3 pb-3">
    <div class="flex items-center gap-2 rounded-full bg-surface2 p-1" x-show="authed === true">
      <button
        class="pill-toggle"
        :class="mode === 'music' ? 'pill-toggle-active' : 'pill-toggle-inactive'"
        @click="setMode('music')"
        :aria-pressed="mode === 'music'"
      >Music</button>
      <button
        class="pill-toggle"
        :class="mode === 'people' ? 'pill-toggle-active' : 'pill-toggle-inactive'"
        @click="setMode('people')"
        :aria-pressed="mode === 'people'"
      >People</button>
    </div>
  </header>

  <main class="flex flex-col items-center gap-8 px-4">
    <div x-show="authed === false" class="card flex w-full max-w-sm flex-col items-center gap-3 px-6 py-12 text-center">
      <span class="text-3xl">🎧</span>
      <p class="font-semibold text-neutral-100">Find your wavelength</p>
      <p class="text-sm text-neutral-400">Log in with Spotify to start swiping on people and music.</p>
      <a href="/login" class="btn-primary mt-2 w-full">Log in</a>
    </div>

    <div
      id="deck-container"
      class="relative w-full max-w-sm"
      :class="mode === 'music' ? 'aspect-square' : 'aspect-[3/4]'"
      x-show="authed === true && current"
    >
      <article class="card absolute inset-0 overflow-hidden rounded-3xl" id="card">
        <img :src="mode === 'music' ? current?.imageUrl : current?.primaryPhotoUrl" :alt="current?.name || current?.displayName || 'candidate photo'" class="absolute inset-0 h-full w-full object-cover" />
        <!-- pointerdown.stop: without it this bubbles to #card and
             attachSwipeDeck's own pointerdown listener starts a drag capture,
             which swallows the button's click entirely. Deliberately
             tap-to-play, not autoplay-on-card-appear: most mobile browsers
             block unmuted autoplay without a gesture anyway, and firing
             sound on every card swiped past would be disruptive regardless.
             Playback itself now happens in the fixed player bar
             (public/playerBar.js) above the bottom nav, not inline here --
             this chip just hands off to it and reflects whether this
             track is the one currently playing there. -->
        <button
          type="button"
          x-show="current?.anthemTrack"
          class="absolute right-3 top-3 z-10 flex max-w-[75%] items-center gap-1.5 rounded-full bg-black/60 px-3 py-1.5 text-xs font-medium text-white backdrop-blur-sm"
          @pointerdown.stop
          @click.stop="toggleAnthem()"
          :aria-label="isCurrentAnthem() ? 'Pause' : `Play ${current?.anthemTrack?.name}`"
        >
          <span aria-hidden="true" x-text="isCurrentAnthem() ? '⏸' : '🎵'"></span>
          <span class="truncate" x-text="current?.anthemTrack?.name"></span>
        </button>
        <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-5 pt-16">
          <h2 class="text-2xl font-bold" x-text="current?.name || current?.displayName"></h2>
          <p class="text-neutral-200" x-text="current?.bio || current?.distanceLabel"></p>
          <div x-show="mode === 'people' && current?.topGenres?.length > 0" class="mt-2 flex flex-wrap gap-1.5">
            <template x-for="g in current?.topGenres || []" :key="g">
              <span class="pill-toggle pill-toggle-inactive text-xs" x-text="g"></span>
            </template>
          </div>
        </div>
      </article>
    </div>

    <div x-show="authed === true && !current" class="card flex w-full max-w-sm flex-col items-center gap-2 px-6 py-10 text-center">
      <span class="text-3xl">🌊</span>
      <p class="font-semibold text-neutral-200">No new waves right now</p>
      <p class="text-sm text-neutral-400" x-text="mode === 'music' ? 'Check back later, or search for an artist you like.' : 'Check back later for more matches.'"></p>
      <button
        x-show="mode === 'music'"
        class="btn-secondary mt-2 flex w-full items-center justify-center gap-2"
        @click="openSearch()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
          <circle cx="11" cy="11" r="7" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        Search for an artist
      </button>
    </div>

    <div class="flex items-center gap-8" x-show="authed === true && current && !matchModal">
      <button
        class="btn-secondary h-16 w-16 rounded-full text-2xl"
        @click="decide('left')"
        aria-label="Pass"
      >✕</button>
      <button
        x-show="mode === 'music'"
        class="btn-secondary h-14 w-14 rounded-full"
        @click="decide('skip')"
        aria-label="Skip -- I don't know this artist, ask me again later"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto h-6 w-6">
          <path d="M5 4l10 8-10 8V4z" />
          <path d="M19 5v14" />
        </svg>
      </button>
      <button
        x-show="mode === 'people'"
        class="btn-secondary h-14 w-14 rounded-full"
        @click="viewProfile()"
        aria-label="View full profile"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto h-6 w-6">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="11" x2="12" y2="16" />
          <circle cx="12" cy="8" r="0.5" fill="currentColor" stroke-width="1.5" />
        </svg>
      </button>
      <button
        class="btn-primary h-20 w-20 rounded-full"
        @click="decide('right')"
        aria-label="Like"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-9 w-9">
          <path d="M12 21C2 15 2 10 3 7L7 11L12 7L17 11L21 7C22 10 22 15 12 21Z" />
        </svg>
      </button>
    </div>

    <button
      type="button"
      x-show="authed === true && current && !matchModal && mode === 'music'"
      class="btn-ghost flex items-center gap-1.5 text-sm"
      @click="openSearch()"
      aria-label="Search for an artist"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <circle cx="11" cy="11" r="7" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      Search
    </button>
  </main>

  <div
    x-show="showSearch"
    class="fixed inset-0 z-20 flex flex-col bg-base/95 p-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-label="Search for an artist"
  >
    <div class="mx-auto flex w-full max-w-md items-center gap-2">
      <input
        x-ref="searchInput"
        class="field flex-1"
        type="search"
        placeholder="Search for an artist..."
        x-model="searchQuery"
        @input="onSearchInput()"
      />
      <button class="btn-ghost" @click="closeSearch()">Cancel</button>
    </div>
    <ul class="mx-auto mt-4 flex w-full max-w-md flex-col gap-2 overflow-y-auto">
      <template x-for="result in searchResults" :key="result.id || result.spotifyArtistId">
        <li>
          <button class="card flex w-full items-center gap-3 p-3 text-left transition active:scale-[0.98] active:bg-white/5" @click="selectArtist(result)">
            <img :src="result.imageUrl" :alt="result.name" class="h-10 w-10 rounded-full object-cover ring-1 ring-white/10" />
            <span class="text-neutral-100" x-text="result.name"></span>
          </button>
        </li>
      </template>
    </ul>
    <p x-show="searchQuery.trim().length > 0 && !searching && searchResults.length === 0" class="mx-auto mt-4 w-full max-w-md text-center text-neutral-400">
      No artists found.
    </p>
  </div>

  <div
    x-show="matchModal"
    class="fixed inset-0 z-30 flex flex-col items-center justify-center gap-4 bg-base/95 p-6 text-center backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-label="It's a match"
  >
    <img :src="matchModal?.photoUrl" :alt="matchModal?.name" class="h-32 w-32 rounded-full object-cover ring-4 ring-brand-500" />
    <h2 class="wordmark text-3xl">It's a match!</h2>
    <p class="text-neutral-300">You and <span x-text="matchModal?.name" class="font-semibold text-neutral-100"></span> liked each other.</p>
    <div class="mt-2 flex w-full max-w-xs flex-col gap-2">
      <a :href="`/messages?matchId=${matchModal?.matchId}`" class="btn-primary">Send a Message</a>
      <button class="btn-secondary" @click="dismissMatch()">Keep Swiping</button>
    </div>
  </div>

  <div
    x-show="genrePrompt"
    class="fixed inset-0 z-30 flex flex-col items-center justify-center gap-4 bg-base/95 p-6 text-center backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    :aria-label="`Hide ${genrePrompt} going forward?`"
  >
    <span class="text-3xl">🙈</span>
    <h2 class="text-xl font-bold">Not into <span x-text="genrePrompt" class="text-brand-400"></span>?</h2>
    <p class="text-neutral-300">You've passed on 10 artists in this genre. Want to stop seeing it in your deck?</p>
    <div class="mt-2 flex w-full max-w-xs flex-col gap-2">
      <button class="btn-primary" @click="blockGenrePrompt()">Hide "<span x-text="genrePrompt"></span>" Going Forward</button>
      <button class="btn-secondary" @click="genrePrompt = null">Keep Showing It</button>
    </div>
  </div>

  <script type="module">
    import { api } from '/app.js';
    import { attachSwipeDeck } from '/swipe.js';
    import { mountHeader, mountNav } from '/nav.js';
    import { getAuthedUser } from '/auth.js';
    import { shouldSearch, debounce, loadStoredMode, storeMode, saveSearchState, takeSearchState } from '/search.js';
    import { play, togglePlayPause, isCurrentTrack, mountPlayerBar } from '/playerBar.js';
    import { showErrorToast } from '/toast.js';
    mountHeader();
    mountNav();
    mountPlayerBar();

    window.deckApp = function () {
      return {
        // Restored from localStorage (see search.js's own comment) rather
        // than always starting on 'people' -- switching to Music mode used
        // to never stick across a fresh page load (including the browser's
        // back button after tapping into a search result), forcing a
        // manual re-toggle back to Music every single time.
        mode: loadStoredMode(localStorage),
        queue: [],
        current: null,
        detachSwipe: null,
        authed: null,
        showSearch: false,
        searchQuery: '',
        searchResults: [],
        searching: false,
        debouncedSearch: null,
        matchModal: null,
        // Set to a genre name once the swipe response reports that genre's
        // pass count just crossed the threshold (src/routes/musicSwipes.ts);
        // null the rest of the time.
        genrePrompt: null,

        // Reads playerBar.js's own module state rather than keeping a local
        // copy -- true exactly when the current card's anthem is the track
        // actually playing in the fixed bar.
        isCurrentAnthem() {
          return !!this.current?.anthemTrack && isCurrentTrack(this.current.anthemTrack.spotifyId);
        },

        async init() {
          const user = await getAuthedUser();
          this.authed = !!user;
          if (this.authed) {
            await this.loadQueue();
            // Reopens the search modal with its previous query/results if
            // this load is the return trip from tapping into a search
            // result (selectArtist saves it right before navigating away,
            // below) -- otherwise search.js's takeSearchState finds
            // nothing and this is a no-op, same as any other ordinary
            // visit to the deck.
            if (this.mode === 'music') {
              const saved = takeSearchState(sessionStorage);
              if (saved) {
                this.searchQuery = saved.query;
                this.searchResults = saved.results;
                this.showSearch = true;
              }
            }
          }
          this.debouncedSearch = debounce(() => this.runSearch(), 300);
        },

        async setMode(mode) {
          this.mode = mode;
          storeMode(localStorage, mode);
          this.queue = [];
          this.current = null;
          // Deliberately does not stop whatever's playing in the fixed
          // player bar -- switching mode (or swiping to the next card,
          // below) is not an explicit "stop" action, matching this app's
          // "only an explicit tap changes the active track" rule for the
          // bar everywhere else.
          await this.loadQueue();
        },

        async loadQueue() {
          const res = await api.candidates(this.mode, 10);
          this.queue = res.candidates;
          this.showNext();
        },

        async showNext() {
          if (this.detachSwipe) this.detachSwipe();
          this.current = this.queue.shift() ?? null;
          this.$nextTick(() => {
            const card = document.getElementById('card');
            if (card && this.current) {
              this.detachSwipe = attachSwipeDeck(card, { onSwipe: (dir) => this.decide(dir) });
            }
          });
        },

        async decide(direction) {
          if (!this.current) return;
          const swiped = this.current;
          try {
            if (this.mode === 'people') {
              const res = await api.swipe('people', { target_id: swiped.id, direction });
              if (res.matched) {
                // Hold on the celebration instead of immediately advancing --
                // dismissMatch() (or the deck's own showNext/loadQueue logic)
                // moves to the next candidate once the user is ready.
                this.matchModal = { name: swiped.displayName, photoUrl: swiped.primaryPhotoUrl, matchId: res.matchId };
                return;
              }
            } else {
              const res = await api.swipe('music', { item_type: swiped.itemType, item_id: swiped.itemId, direction });
              // Shown once the queue/card transition below has already
              // moved on -- the prompt is about a genre in general, not
              // this specific card, so it doesn't need to block advancing.
              if (res.crossedGenre) this.genrePrompt = res.crossedGenre;
            }
          } catch (e) {
            // Leave `current` in place either way -- the swipe didn't save,
            // so advancing would silently drop it instead of letting the
            // user retry.
            showErrorToast(
              e.status === 429
                ? "You're swiping too fast -- wait a moment and try again."
                : 'Could not save that. Please try again.'
            );
            return;
          }
          if (this.queue.length === 0) await this.loadQueue();
          else this.showNext();
        },

        async dismissMatch() {
          this.matchModal = null;
          if (this.queue.length === 0) await this.loadQueue();
          else this.showNext();
        },

        async blockGenrePrompt() {
          const genre = this.genrePrompt;
          this.genrePrompt = null;
          try {
            await api.blockGenre(genre);
          } catch (e) {
            // Non-fatal -- the deck already moved on by the time this
            // prompt appears, so a failed block just means the genre
            // keeps showing up; nothing here to roll back or retry inline.
            showErrorToast('Could not hide that genre. You can try again from Settings → Preferences.');
          }
        },

        openSearch() {
          this.showSearch = true;
          // The plain `autofocus` attribute only fires once, on the initial
          // (hidden) page load -- this element never re-parses when x-show
          // later reveals it, so it silently did nothing. $nextTick waits for
          // Alpine to actually flip the modal's `display` before focusing,
          // otherwise .focus() on a still-hidden input is a no-op too.
          this.$nextTick(() => this.$refs.searchInput?.focus());
        },

        closeSearch() {
          this.showSearch = false;
          this.searchQuery = '';
          this.searchResults = [];
        },

        onSearchInput() {
          if (!shouldSearch(this.searchQuery)) {
            this.searchResults = [];
            return;
          }
          this.debouncedSearch();
        },

        async runSearch() {
          this.searching = true;
          try {
            const res = await api.artistSearch(this.searchQuery.trim());
            this.searchResults = res.results;
          } catch (e) {
            showErrorToast('Could not search right now. Please try again.');
          } finally {
            this.searching = false;
          }
        },

        async selectArtist(result) {
          // Saved right before leaving the deck entirely (this is a real
          // navigation, not an SPA route change) so init()'s own
          // takeSearchState call can reopen this same search on the way
          // back -- see search.js's own comment on why this landed the
          // user somewhere unhelpful (defaulting back to People mode, with
          // no memory of what they'd searched) instead.
          saveSearchState(sessionStorage, { query: this.searchQuery, results: this.searchResults });

          // Already cataloged -- result.id is our internal artist UUID.
          if (result.inCatalog) {
            window.location.href = `/artist?id=${result.id}`;
            return;
          }
          // A live Spotify result has no internal id yet (see GET
          // /api/artists/search's `inCatalog: false` shape) -- persist it
          // first so there's a real artist row (and UUID) to navigate to.
          try {
            const res = await api.createArtist(result.spotifyArtistId);
            window.location.href = `/artist?id=${res.artistId}`;
          } catch (e) {
            showErrorToast('Could not add that artist. Please try again.');
          }
        },

        viewProfile() {
          if (!this.current) return;
          window.location.href = `/profile?id=${this.current.id}`;
        },

        async toggleAnthem() {
          if (!this.current?.anthemTrack) return;
          if (this.isCurrentAnthem()) {
            await togglePlayPause();
            return;
          }
          const { spotifyId, name, imageUrl } = this.current.anthemTrack;
          await play({ spotifyId, name, imageUrl });
        },
      };
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="fixed inset-x-0 z-10" style="bottom: calc(var(--wl-nav-h) + env(safe-area-inset-bottom))">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
