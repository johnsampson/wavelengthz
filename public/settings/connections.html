<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Account connections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="apple-touch-icon" href="https://img.wavelengthz.com/wavelengthz-logo-transparent.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-app">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()">
  <a href="/settings" class="mx-auto mb-2 block max-w-md text-sm text-neutral-400">&larr; Settings</a>
  <h1 class="mx-auto mb-4 max-w-md text-2xl font-bold">Account connections</h1>

  <p x-show="info" x-text="info" class="mx-auto mb-4 max-w-md text-brand-400" role="status"></p>
  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>

  <div x-show="!loading && hasSpotify" class="mx-auto mb-4 flex max-w-md items-center gap-3">
    <img :src="spotifyAvatarUrl" alt="" class="h-12 w-12 rounded-full object-cover ring-1 ring-white/10" />
    <div class="text-sm">
      <p class="font-semibold text-neutral-200">Connected via Spotify</p>
      <p class="text-neutral-500">This photo is never shown to matches -- it's just your account identity.</p>
    </div>
  </div>
  <div x-show="!loading && !hasSpotify" class="mx-auto mb-4 max-w-md">
    <a href="/login/spotify?intent=connect" class="btn-primary block w-full text-center">Connect Spotify</a>
    <p class="mt-1 text-center text-xs text-neutral-500">Link your Spotify account for music-taste matching.</p>
  </div>
  </div>

  <script type="module">
    import { createConnectionsApp } from '/settings/connections.js';
    import { mountHeader, mountNav } from '/nav.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    mountPlayerBar();

    window.pageApp = createConnectionsApp;
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="fixed inset-x-0 z-10" style="bottom: var(--wl-nav-h)">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
