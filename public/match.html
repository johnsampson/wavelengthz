<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="apple-touch-icon" href="https://img.wavelengthz.com/wavelengthz-logo-transparent.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-app">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()" x-init="init()">

  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>

  <template x-if="match">
    <div class="mx-auto flex max-w-md flex-col gap-6">
      <div>
        <h1 class="text-2xl font-bold" x-text="match.otherDisplayName || 'Your match'"></h1>
        <a :href="`/profile?id=${match.otherUserId}`" class="text-sm text-brand-300 hover:text-brand-200">View full profile</a>
      </div>

      <section x-show="overlap.sharedGenres.length > 0" class="card p-4">
        <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Shared genres</h2>
        <div class="flex flex-wrap gap-2">
          <template x-for="g in overlap.sharedGenres" :key="g.genre">
            <span class="pill-toggle pill-toggle-inactive" x-text="g.genre"></span>
          </template>
        </div>
      </section>

      <section x-show="overlap.sharedArtists.length > 0" class="card p-4">
        <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Artists you both like</h2>
        <div class="grid grid-cols-3 gap-3">
          <template x-for="a in overlap.sharedArtists" :key="a.id">
            <div class="flex flex-col items-center gap-1 text-center">
              <img :src="a.imageUrl" :alt="a.name" class="h-16 w-16 rounded-full object-cover ring-1 ring-white/10" />
              <span class="text-xs text-neutral-300" x-text="a.name"></span>
            </div>
          </template>
        </div>
      </section>

      <section x-show="overlap.sharedTracks.length > 0" class="card p-4">
        <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Songs you both like</h2>
        <ul class="flex flex-col gap-2">
          <template x-for="t in overlap.sharedTracks" :key="t.id">
            <li class="flex items-center gap-3">
              <img :src="t.imageUrl" :alt="t.name" class="h-10 w-10 rounded object-cover ring-1 ring-white/10" />
              <div class="min-w-0">
                <p class="truncate text-sm text-neutral-100" x-text="t.name"></p>
                <p class="truncate text-xs text-neutral-500" x-text="t.artistName"></p>
              </div>
            </li>
          </template>
        </ul>
      </section>

      <p
        x-show="overlap.sharedGenres.length === 0 && overlap.sharedArtists.length === 0 && overlap.sharedTracks.length === 0"
        class="text-center text-neutral-400"
      >
        No shared music activity yet -- keep swiping in Music mode!
      </p>

      <a :href="`/messages?matchId=${match.id}`" class="btn-primary">Message</a>

      <div class="flex justify-center gap-4">
        <button class="btn-ghost" @click="unmatch()">Unmatch</button>
        <button class="btn-ghost text-amber-400" @click="report()">Report</button>
        <button class="btn-ghost" @click="block()">Block</button>
      </div>
    </div>
  </template>
  </div>

  <script type="module">
    import { mountHeader, mountNav } from '/nav.js';
    import { createMatchApp } from '/match.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    mountPlayerBar();

    window.pageApp = createMatchApp;
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="fixed inset-x-0 z-10" style="bottom: var(--wl-nav-h)">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
