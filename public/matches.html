<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Matches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-app">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()" x-init="init()">
  <h1 class="mx-auto mb-4 max-w-md text-2xl font-bold">Your matches</h1>
  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>
  <ul class="mx-auto flex max-w-md flex-col gap-2">
    <template x-for="match in matches" :key="match.id">
      <li class="card p-3">
        <a class="font-semibold text-brand-300 hover:text-brand-200" :href="`/match?id=${match.id}`" x-text="match.otherDisplayName || match.otherUserId"></a>
      </li>
    </template>
  </ul>
  <p x-show="matches.length === 0" class="mx-auto max-w-md text-center text-neutral-400">No matches yet — keep swiping!</p>
  </div>

  <script type="module">
    import { mountHeader, mountNav } from '/nav.js';
    import { createMatchesApp } from '/matches.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    mountPlayerBar();

    window.pageApp = createMatchesApp;
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="fixed inset-x-0 z-10" style="bottom: calc(var(--wl-nav-h) + env(safe-area-inset-bottom))">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
