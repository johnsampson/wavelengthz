<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Matches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-24" x-data="matchesApp()" x-init="init()">
  <div id="wl-header-root"></div>
  <h1 class="mx-auto mb-4 max-w-md text-2xl font-bold">Your matches</h1>
  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>
  <ul class="mx-auto flex max-w-md flex-col gap-2">
    <template x-for="match in matches" :key="match.id">
      <li class="card p-3">
        <a class="font-semibold text-brand-300 hover:text-brand-200" :href="`/match?id=${match.id}`" x-text="match.otherDisplayName || match.otherUserId"></a>
      </li>
    </template>
  </ul>
  <p x-show="matches.length === 0" class="mx-auto max-w-md text-center text-neutral-400">No matches yet — keep swiping!</p>

  <script type="module">
    import { api } from '/app.js';
    import { mountHeader, mountNav } from '/nav.js';
    import { requireAuth } from '/auth.js';
    mountHeader();
    mountNav();

    window.matchesApp = function () {
      return {
        matches: [],
        error: null,
        async init() {
          if (!(await requireAuth())) return;
          this.load();
        },
        async load() {
          this.error = null;
          try {
            const res = await api.matches();
            this.matches = res.matches;
          } catch (e) {
            this.error = 'Could not load your matches. Please try again.';
          }
        },
      };
    };
  </script>
  <script defer src="/alpine.js"></script>
  <div id="wl-nav-root"></div>
</body>
</html>
