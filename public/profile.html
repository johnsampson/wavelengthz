<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="apple-touch-icon" href="https://img.wavelengthz.com/wavelengthz-logo-transparent.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-app">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()" x-init="init()">

  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>

  <template x-if="profile">
    <div class="mx-auto flex max-w-md flex-col gap-6">
      <div class="relative" x-show="profile.photoUrls.length > 0">
        <img
          :src="profile.photoUrls[carouselIndex]"
          alt=""
          class="aspect-[4/3] w-full cursor-pointer rounded-2xl object-cover ring-1 ring-white/10"
          @click="openLightbox()"
        />
        <button
          type="button"
          class="btn-ghost absolute left-2 top-1/2 -translate-y-1/2 text-white"
          x-show="profile.photoUrls.length > 1"
          @click.stop="prevPhoto()"
          aria-label="Previous photo"
        >‹</button>
        <button
          type="button"
          class="btn-ghost absolute right-2 top-1/2 -translate-y-1/2 text-white"
          x-show="profile.photoUrls.length > 1"
          @click.stop="nextPhoto()"
          aria-label="Next photo"
        >›</button>
        <p
          x-show="profile.photoUrls.length > 1"
          class="absolute bottom-2 right-2 rounded-full bg-black/60 px-2 py-0.5 text-xs text-white"
          x-text="`${carouselIndex + 1} / ${profile.photoUrls.length}`"
        ></p>
      </div>
      <p x-show="profile.photoUrls.length === 0" class="card flex aspect-[4/3] items-center justify-center text-neutral-500">
        No photos yet
      </p>

      <div>
        <p x-show="profile.isSelf" class="mb-1 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Your Profile</p>
        <h1 class="text-2xl font-bold" x-text="profile.displayName || 'Wavelengthz user'"></h1>
        <p class="text-neutral-400" x-text="profile.distanceLabel"></p>
        <p class="mt-2 text-neutral-200" x-text="profile.bio"></p>
        <div class="mt-2 flex gap-2" x-show="!profile.isSelf">
          <span x-show="profile.isMatch" class="pill-toggle pill-toggle-active">Matched</span>
          <span x-show="profile.likedYou && !profile.isMatch" class="pill-toggle pill-toggle-inactive text-brand-400">Likes you</span>
        </div>
        <a
          x-show="profile.isMatch"
          :href="`/messages?matchId=${profile.matchId}`"
          class="btn-primary mt-3 block w-full text-center"
        >Send a Message</a>
      </div>

      <section x-show="profile.topGenres.length > 0" class="card p-4">
        <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Top genres on Spotify</h2>
        <div class="flex flex-wrap gap-2">
          <template x-for="g in profile.topGenres" :key="g">
            <span class="pill-toggle pill-toggle-inactive" x-text="g"></span>
          </template>
        </div>
      </section>

      <section x-show="profile.topArtists.length > 0" class="card p-4">
        <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Top artists on Spotify</h2>
        <div class="grid grid-cols-3 gap-3">
          <template x-for="a in profile.topArtists" :key="a.id">
            <a :href="`/artist?id=${a.id}`" class="flex flex-col items-center gap-1 text-center">
              <img :src="a.imageUrl" :alt="a.name" class="h-16 w-16 rounded-full object-cover ring-1 ring-white/10" />
              <span class="text-xs text-neutral-300" x-text="a.name"></span>
            </a>
          </template>
        </div>
      </section>

      <section x-show="profile.topTracks.length > 0" class="card p-4">
        <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Top tracks on Spotify</h2>
        <ul class="flex flex-col gap-2">
          <template x-for="t in profile.topTracks" :key="t.id">
            <li class="flex flex-col gap-2">
              <div class="flex items-center gap-3">
                <img :src="t.imageUrl" :alt="t.name" class="h-10 w-10 rounded object-cover ring-1 ring-white/10" />
                <div class="min-w-0 flex-1">
                  <p class="truncate text-sm text-neutral-100" x-text="t.name"></p>
                  <p x-show="profile.anthemTrack?.id === t.id" class="text-xs text-brand-400">🎵 Anthem</p>
                </div>
                <!-- Self only -- an anthem is the profile owner's own pick, from
                     among their own top tracks (POST /api/me/anthem enforces
                     that server-side too). A viewer sees the "🎵 Anthem" label
                     above, not this toggle. -->
                <button
                  type="button"
                  x-show="profile.isSelf"
                  class="btn-ghost h-8 w-8 shrink-0 rounded-full"
                  @click="toggleAnthem(t)"
                  :class="profile.anthemTrack?.id === t.id ? 'text-brand-400' : 'text-neutral-400'"
                  :aria-label="profile.anthemTrack?.id === t.id ? 'Remove as anthem' : 'Set as anthem'"
                >
                  <svg viewBox="0 0 24 24" :fill="profile.anthemTrack?.id === t.id ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.5" class="mx-auto h-4 w-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.5a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.562.562 0 00-.586 0l-4.725 2.885a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557L2.56 10.386a.562.562 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
                  </svg>
                </button>
                <button
                  type="button"
                  class="btn-ghost h-8 w-8 shrink-0 rounded-full"
                  @click="togglePlayer(t)"
                  :aria-label="isCurrentTrack(t.spotifyId) ? 'Pause' : 'Play'"
                >
                  <svg x-show="!isCurrentTrack(t.spotifyId)" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-4 w-4">
                    <path d="M8 5v14l11-7z" />
                  </svg>
                  <svg x-show="isCurrentTrack(t.spotifyId)" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-4 w-4">
                    <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
                  </svg>
                </button>
              </div>
            </li>
          </template>
        </ul>
      </section>

      <template x-if="!profile.isSelf">
        <div class="flex flex-col gap-6">
          <section x-show="overlap.sharedGenres.length > 0" class="card p-4">
            <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Shared genres</h2>
            <div class="flex flex-wrap gap-2">
              <template x-for="g in overlap.sharedGenres" :key="g.genre">
                <span class="pill-toggle pill-toggle-inactive" x-text="g.genre"></span>
              </template>
            </div>
          </section>

          <section x-show="overlap.sharedArtists.length > 0" class="card p-4">
            <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Artists you both like</h2>
            <div class="grid grid-cols-3 gap-3">
              <template x-for="a in overlap.sharedArtists.slice(0, visibleArtistsCount)" :key="a.id">
                <a :href="`/artist?id=${a.id}`" class="flex flex-col items-center gap-1 text-center">
                  <img :src="a.imageUrl" :alt="a.name" class="h-16 w-16 rounded-full object-cover ring-1 ring-white/10" />
                  <span class="text-xs text-neutral-300" x-text="a.name"></span>
                </a>
              </template>
            </div>
            <button
              type="button"
              class="btn-ghost mt-3 w-full text-sm"
              x-show="overlap.sharedArtists.length > visibleArtistsCount"
              @click="visibleArtistsCount += PAGE_SIZE"
            >Show more</button>
          </section>

          <section x-show="overlap.sharedTracks.length > 0" class="card p-4">
            <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Songs you both like</h2>
            <ul class="flex flex-col gap-2">
              <template x-for="t in overlap.sharedTracks.slice(0, visibleTracksCount)" :key="t.id">
                <li class="flex flex-col gap-2">
                  <div class="flex items-center gap-3">
                    <img :src="t.imageUrl" :alt="t.name" class="h-10 w-10 rounded object-cover ring-1 ring-white/10" />
                    <div class="min-w-0 flex-1">
                      <p class="truncate text-sm text-neutral-100" x-text="t.name"></p>
                      <p class="truncate text-xs text-neutral-500" x-text="t.artistName"></p>
                    </div>
                    <button
                      type="button"
                      class="btn-ghost h-8 w-8 shrink-0 rounded-full"
                      @click="togglePlayer(t)"
                      :aria-label="isCurrentTrack(t.spotifyId) ? 'Pause' : 'Play'"
                    >
                      <svg x-show="!isCurrentTrack(t.spotifyId)" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-4 w-4">
                        <path d="M8 5v14l11-7z" />
                      </svg>
                      <svg x-show="isCurrentTrack(t.spotifyId)" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-4 w-4">
                        <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
                      </svg>
                    </button>
                  </div>
                </li>
              </template>
            </ul>
            <button
              type="button"
              class="btn-ghost mt-3 w-full text-sm"
              x-show="overlap.sharedTracks.length > visibleTracksCount"
              @click="visibleTracksCount += PAGE_SIZE"
            >Show more</button>
          </section>

          <p
            x-show="overlap.sharedGenres.length === 0 && overlap.sharedArtists.length === 0 && overlap.sharedTracks.length === 0"
            class="text-center text-neutral-400"
          >
            No shared music activity yet.
          </p>

          <button type="button" class="btn-ghost text-sm text-amber-400" @click="report()">Report this profile</button>
        </div>
      </template>

      <template x-if="profile.isSelf">
        <div class="flex flex-col gap-6">
          <section x-show="profile.recentArtists.length > 0" class="card p-4">
            <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Your recent artists</h2>
            <div class="grid grid-cols-3 gap-3">
              <template x-for="a in profile.recentArtists" :key="a.id">
                <a :href="`/artist?id=${a.id}`" class="flex flex-col items-center gap-1 text-center">
                  <img :src="a.imageUrl" :alt="a.name" class="h-16 w-16 rounded-full object-cover ring-1 ring-white/10" />
                  <span class="text-xs text-neutral-300" x-text="a.name"></span>
                </a>
              </template>
            </div>
          </section>

          <section x-show="profile.recentTracks.length > 0" class="card p-4">
            <h2 class="mb-3 text-sm font-semibold text-neutral-400 uppercase tracking-wide">Your recent songs</h2>
            <ul class="flex flex-col gap-2">
              <template x-for="t in profile.recentTracks" :key="t.id">
                <li class="flex flex-col gap-2">
                  <div class="flex items-center gap-3">
                    <img :src="t.imageUrl" :alt="t.name" class="h-10 w-10 rounded object-cover ring-1 ring-white/10" />
                    <p class="min-w-0 flex-1 truncate text-sm text-neutral-100" x-text="t.name"></p>
                    <button
                      type="button"
                      class="btn-ghost h-8 w-8 shrink-0 rounded-full"
                      @click="togglePlayer(t)"
                      :aria-label="isCurrentTrack(t.spotifyId) ? 'Pause' : 'Play'"
                    >
                      <svg x-show="!isCurrentTrack(t.spotifyId)" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-4 w-4">
                        <path d="M8 5v14l11-7z" />
                      </svg>
                      <svg x-show="isCurrentTrack(t.spotifyId)" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-4 w-4">
                        <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
                      </svg>
                    </button>
                  </div>
                </li>
              </template>
            </ul>
          </section>
        </div>
      </template>
    </div>
  </template>

  <div
    x-show="lightboxOpen"
    class="fixed inset-0 z-30 flex items-center justify-center bg-black/90 p-4"
    role="dialog"
    aria-modal="true"
    aria-label="Photo viewer"
    @click="closeLightbox()"
  >
    <template x-if="lightboxOpen">
      <img :src="profile.photoUrls[carouselIndex]" alt="" class="max-h-full max-w-full rounded-lg object-contain" @click.stop />
    </template>
    <button type="button" class="btn-ghost absolute top-4 right-4 text-white" @click="closeLightbox()" aria-label="Close">✕</button>
    <button
      type="button"
      class="btn-ghost absolute left-4 text-white"
      x-show="profile && profile.photoUrls.length > 1"
      @click.stop="prevPhoto()"
      aria-label="Previous photo"
    >‹</button>
    <button
      type="button"
      class="btn-ghost absolute right-4 text-white"
      x-show="profile && profile.photoUrls.length > 1"
      @click.stop="nextPhoto()"
      aria-label="Next photo"
    >›</button>
  </div>
  </div>

  <script type="module">
    import { mountHeader, mountNav } from '/nav.js';
    import { createPersonProfileApp } from '/personProfile.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    mountPlayerBar();

    window.pageApp = createPersonProfileApp;
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="fixed inset-x-0 z-10" style="bottom: var(--wl-nav-h)">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
