<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-24" x-data="notificationsApp()" x-init="init()">
  <div id="wl-header-root"></div>
  <h1 class="mx-auto mb-4 max-w-md text-2xl font-bold">Notifications</h1>

  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>

  <ul class="mx-auto flex max-w-md flex-col gap-2">
    <template x-for="n in notifications" :key="n.id">
      <li>
        <button class="card flex w-full items-center gap-3 p-3 text-left" @click="open(n)">
          <span class="text-xl" x-text="n.type === 'match' ? '🎉' : '💬'"></span>
          <span class="min-w-0 flex-1">
            <span class="block text-sm text-neutral-100" x-text="n.type === 'match' ? 'New match!' : 'New message'"></span>
            <span class="block text-xs text-neutral-500" x-text="new Date(n.createdAt).toLocaleString()"></span>
          </span>
          <span x-show="!n.readAt" class="h-2 w-2 shrink-0 rounded-full bg-brand-500" aria-label="Unread"></span>
        </button>
      </li>
    </template>
  </ul>
  <p x-show="notifications.length === 0" class="mx-auto max-w-md text-center text-neutral-400">No notifications yet.</p>

  <script type="module">
    import { api } from '/app.js';
    import { mountHeader, mountNav } from '/nav.js';
    import { requireAuth } from '/auth.js';
    mountHeader();
    mountNav();

    window.notificationsApp = function () {
      return {
        notifications: [],
        error: null,

        async init() {
          if (!(await requireAuth())) return;
          try {
            const res = await api.notifications();
            this.notifications = res.notifications;
          } catch (e) {
            this.error = 'Could not load your notifications. Please try again.';
          }
        },

        async open(n) {
          if (!n.readAt) {
            try {
              await api.markNotificationRead(n.id);
              n.readAt = Date.now();
            } catch (e) {
              // Non-fatal -- still navigate even if marking read failed.
            }
          }
          if (n.matchId) window.location.href = `/match?id=${n.matchId}`;
        },
      };
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <div id="wl-nav-root"></div>
</body>
</html>
