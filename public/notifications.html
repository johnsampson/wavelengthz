<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="apple-touch-icon" href="https://img.wavelengthz.com/wavelengthz-logo-transparent.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-app">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()" x-init="init()">
  <h1 class="mx-auto mb-4 max-w-md text-2xl font-bold">Notifications</h1>

  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>

  <ul class="mx-auto flex max-w-md flex-col gap-2">
    <template x-for="n in notifications" :key="n.id">
      <li>
        <button class="card flex w-full items-center gap-3 p-3 text-left transition active:scale-[0.98] active:bg-white/5" @click="open(n)">
          <span class="text-xl" x-text="n.type === 'match' ? '🎉' : '💬'"></span>
          <span class="min-w-0 flex-1">
            <span class="block text-sm text-neutral-100" x-text="n.type === 'match' ? 'New match!' : 'New message'"></span>
            <span class="block text-xs text-neutral-500" x-text="new Date(n.createdAt).toLocaleString()"></span>
          </span>
          <span x-show="!n.readAt" class="h-2 w-2 shrink-0 rounded-full bg-brand-500" aria-label="Unread"></span>
        </button>
      </li>
    </template>
  </ul>
  <p x-show="notifications.length === 0" class="mx-auto max-w-md text-center text-neutral-400">No notifications yet.</p>
  </div>

  <script type="module">
    import { mountHeader, mountNav } from '/nav.js';
    import { createNotificationsApp } from '/notifications.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    mountPlayerBar();

    window.pageApp = createNotificationsApp;
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="fixed inset-x-0 z-10" style="bottom: var(--wl-nav-h)">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
