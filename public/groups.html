<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body class="min-h-dvh bg-base text-neutral-50 p-4 pb-app">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()" x-init="init()">
  <h1 class="mx-auto mb-4 max-w-md text-2xl font-bold">Groups near you</h1>

  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>

  <div class="mx-auto mb-4 max-w-md">
    <button type="button" class="btn-primary w-full" @click="showCreate = !showCreate">
      <span x-text="showCreate ? 'Cancel' : '+ Start a group'"></span>
    </button>
  </div>

  <form x-show="showCreate" class="card mx-auto mb-4 flex max-w-md flex-col gap-3 p-4" @submit.prevent="create()">
    <label class="flex flex-col gap-1">
      <span class="field-label">Group name</span>
      <input class="field" type="text" x-model="newName" maxlength="60" required />
    </label>
    <label class="flex flex-col gap-1">
      <span class="field-label">Topic (optional)</span>
      <input class="field" type="text" x-model="newTopic" maxlength="100" placeholder="e.g. indie rock, 90s hip-hop..." />
    </label>
    <!-- Start a group from a song (issue #127) -- optional. The picked
         track becomes the group's seed and is pinned above its chat
         compose box, same shared-catalog resolution POST /api/groups/:id/
         messages already does for a track shared mid-thread. -->
    <div class="flex flex-col gap-1">
      <span class="field-label">Song (optional)</span>
      <button
        type="button"
        x-show="!selectedSong"
        class="btn-secondary flex items-center justify-center gap-1.5 text-sm"
        @click="openSongPicker()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
        Start a group from a song
      </button>
      <div x-show="selectedSong" class="card flex items-center gap-3 p-2">
        <img :src="selectedSong?.imageUrl" :alt="selectedSong?.name" class="h-10 w-10 shrink-0 rounded object-cover ring-1 ring-white/10" />
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm text-neutral-100" x-text="selectedSong?.name"></span>
          <span class="block truncate text-xs text-neutral-400" x-text="selectedSong?.artistName"></span>
        </span>
        <button type="button" class="btn-ghost shrink-0 text-xs" @click="clearSelectedSong()">Remove</button>
      </div>
    </div>
    <button type="submit" class="btn-primary">Create</button>
  </form>

  <div
    x-show="showSongPicker"
    class="fixed inset-0 z-20 flex flex-col bg-base/95 p-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-label="Search for a song"
  >
    <div class="mx-auto flex w-full max-w-md items-center gap-2">
      <input
        x-ref="songSearchInput"
        class="field flex-1"
        type="search"
        placeholder="Search for a song..."
        x-model="songQuery"
        @input="onSongQueryInput()"
      />
      <button class="btn-ghost" @click="closeSongPicker()">Cancel</button>
    </div>
    <ul class="mx-auto mt-4 flex w-full max-w-md flex-1 min-h-0 flex-col gap-2 overflow-y-auto">
      <template x-for="result in songResults" :key="result.id || result.spotifyTrackId">
        <li>
          <button class="card flex w-full items-center gap-3 p-3 text-left transition active:scale-[0.98] active:bg-white/5" @click="pickSong(result)">
            <img :src="result.imageUrl" :alt="result.name" class="h-10 w-10 shrink-0 rounded object-cover ring-1 ring-white/10" />
            <span class="min-w-0 flex-1">
              <span class="block truncate text-neutral-100" x-text="result.name"></span>
              <span class="block truncate text-xs text-neutral-400" x-text="result.artistName"></span>
            </span>
          </button>
        </li>
      </template>
    </ul>
    <p x-show="songQuery.trim().length > 1 && !songSearching && songResults.length === 0" class="mx-auto mt-4 w-full max-w-md text-center text-neutral-400">
      No songs found.
    </p>
  </div>

  <ul class="mx-auto flex max-w-md flex-col gap-2">
    <template x-for="g in groups" :key="g.id">
      <li class="card flex items-center justify-between gap-3 p-3">
        <div class="min-w-0">
          <a :href="`/group?id=${g.id}`" class="block truncate font-semibold text-neutral-100" x-text="g.name"></a>
          <p class="truncate text-sm text-neutral-400" x-text="g.topic || g.locationLabel"></p>
          <div class="mt-1 flex items-center gap-2">
            <!-- Overlapping face stack (issue #2). -space-x-2 tucks each
                 photo under the previous one; the ring separates them
                 against the card so they read as a stack rather than a
                 smudge. Empty for a group whose members have no approved
                 photo yet, in which case the count below stands alone. -->
            <div class="flex -space-x-2" x-show="g.memberFaces.length">
              <template x-for="url in g.memberFaces" :key="url">
                <img :src="url" alt="" loading="lazy"
                     class="h-6 w-6 rounded-full object-cover ring-2 ring-surface" />
              </template>
            </div>
            <p class="text-xs text-neutral-500"><span x-text="g.memberCount"></span>/8 members</p>
          </div>
        </div>
        <button type="button" class="btn-secondary shrink-0" x-show="!g.isMember" @click="join(g)">Join</button>
        <a :href="`/group?id=${g.id}`" class="btn-ghost shrink-0" x-show="g.isMember">Open</a>
      </li>
    </template>
  </ul>
  <p x-show="groups.length === 0" class="mx-auto max-w-md text-center text-neutral-400">No groups near you yet — start one!</p>
  </div>

  <script type="module">
    import { mountHeader, mountNav } from '/nav.js';
    import { installTapFeedback } from '/tapFeedback.js';
    import { createGroupsApp } from '/groups.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    installTapFeedback();
    mountPlayerBar();

    window.pageApp = createGroupsApp;
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="wl-gpu-layer fixed inset-x-0 z-10" style="bottom: var(--wl-nav-h)">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
