<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Settings</title>
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-50 p-4" x-data="settingsApp()">
  <h1 class="text-2xl font-semibold mb-4">Settings</h1>
  <p x-show="error" x-text="error" class="text-red-400 max-w-md mb-4" role="alert"></p>
  <p x-show="saved" class="text-emerald-400 max-w-md mb-4">Saved.</p>

  <!-- Disabled until init() has loaded the real max_distance_km: saving while
       the slider still shows its placeholder default would overwrite the
       user's actual radius. -->
  <form class="max-w-md flex flex-col gap-4" @submit.prevent="updateDistance()">
    <label class="flex flex-col gap-1">
      <span>Max distance (km): <span x-text="loading ? '…' : maxDistanceKm"></span></span>
      <input type="range" min="5" max="200" x-model.number="maxDistanceKm" :disabled="loading" />
    </label>
    <button type="submit" class="bg-neutral-800 rounded p-2" :disabled="loading">Save</button>
  </form>

  <button class="mt-6 text-neutral-400 underline" @click="logout()">Log out</button>

  <div class="mt-8 border-t border-neutral-800 pt-4">
    <button class="text-red-400 underline" @click="confirmingDelete = true" x-show="!confirmingDelete">
      Delete my account
    </button>
    <div x-show="confirmingDelete" class="flex flex-col gap-2">
      <p role="alert">This deletes your account. Are you sure?</p>
      <div class="flex gap-2">
        <button class="bg-red-600 rounded px-3 py-1" @click="deleteAccount()">Yes, delete</button>
        <button class="bg-neutral-800 rounded px-3 py-1" @click="confirmingDelete = false">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createSettingsApp } from '/settings.js';

    window.settingsApp = createSettingsApp;
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
