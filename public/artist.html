<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Artist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-24" x-data="artistApp()" x-init="init()">
  <div id="wl-header-root"></div>

  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>

  <template x-if="artist">
    <div class="mx-auto flex max-w-md flex-col gap-6">
      <div class="flex items-center gap-4">
        <img :src="artist.imageUrl" :alt="artist.name" class="h-20 w-20 rounded-full object-cover ring-1 ring-white/10" />
        <div>
          <h1 class="text-2xl font-bold" x-text="artist.name"></h1>
          <div class="mt-1 flex flex-wrap gap-1" x-show="artist.genres.length > 0">
            <template x-for="g in artist.genres" :key="g">
              <span class="pill-toggle pill-toggle-inactive px-2 py-0.5 text-xs" x-text="g"></span>
            </template>
          </div>
          <p class="mt-1 text-sm text-neutral-400">
            <span x-text="artist.totalLikes"></span> like<span x-show="artist.totalLikes !== 1">s</span>
            · <span x-text="artist.totalLikesInArea"></span> in your area
          </p>
        </div>
      </div>

      <ul class="flex flex-col gap-2">
        <template x-for="track in tracks" :key="track.id">
          <li class="card flex flex-col gap-3 p-3">
            <div class="flex items-center gap-3">
              <img :src="track.imageUrl" :alt="track.name" class="h-12 w-12 rounded object-cover ring-1 ring-white/10" />
              <p class="min-w-0 flex-1 truncate text-sm text-neutral-100" x-text="track.name"></p>
              <button
                class="btn-ghost h-9 w-9 rounded-full"
                @click="togglePlayer(track)"
                :aria-label="openTrackId === track.id ? 'Hide player' : 'Show player'"
              >
                <svg x-show="openTrackId !== track.id" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-5 w-5">
                  <path d="M8 5v14l11-7z" />
                </svg>
                <svg x-show="openTrackId === track.id" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-5 w-5">
                  <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
                </svg>
              </button>
              <button
                class="btn-secondary h-9 w-9 rounded-full text-sm"
                :class="track.direction === 'left' ? 'ring-2 ring-neutral-400' : ''"
                @click="swipeTrack(track, 'left')"
                aria-label="Pass"
              >✕</button>
              <button
                class="btn-primary h-9 w-9 rounded-full text-sm"
                :class="track.direction === 'right' ? 'ring-2 ring-white' : ''"
                @click="swipeTrack(track, 'right')"
                aria-label="Like"
              >♥</button>
            </div>
            <template x-if="openTrackId === track.id && customPlayerAvailable">
              <div class="flex items-center gap-3 rounded-xl bg-gradient-to-r from-brand-500/10 to-accent-500/10 p-3 ring-1 ring-brand-500/30">
                <button
                  type="button"
                  class="btn-primary h-9 w-9 shrink-0 rounded-full p-0"
                  @click="togglePlayPause()"
                  :aria-label="playerState && !playerState.paused ? 'Pause' : 'Play'"
                >
                  <svg x-show="!playerState || playerState.paused" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-4 w-4">
                    <path d="M8 5v14l11-7z" />
                  </svg>
                  <svg x-show="playerState && !playerState.paused" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-4 w-4">
                    <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
                  </svg>
                </button>
                <div class="h-1 min-w-0 flex-1 overflow-hidden rounded-full bg-white/10">
                  <div class="h-full rounded-full bg-gradient-to-r from-brand-500 to-accent-500" :style="`width:${progressPct}%`"></div>
                </div>
                <span class="wordmark shrink-0 text-[10px]">Wavelengthz Player</span>
              </div>
            </template>
            <!-- Fallback path: no Premium/streaming-eligible Wavelengthz
                 Player this page load, so this track plays the same way it
                 always has. x-if (not x-show): x-show only toggles CSS
                 display, so a closed iframe stayed mounted and kept playing.
                 x-if actually removes the element from the DOM, which stops
                 Spotify's embedded player. autoplay=1 only takes effect
                 because the iframe is mounted from a click handler
                 (openTrackId is set by @click above) -- that user gesture is
                 what lets the browser's autoplay policy allow it. -->
            <template x-if="openTrackId === track.id && !customPlayerAvailable">
              <div class="flex flex-col gap-1">
                <span class="self-start text-[10px] font-semibold tracking-wide text-amber-400 uppercase">Basic player</span>
                <iframe
                  :src="`https://open.spotify.com/embed/track/${track.spotifyId}?theme=0&autoplay=1`"
                  width="100%"
                  height="80"
                  frameborder="0"
                  allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                  loading="lazy"
                  class="rounded-xl"
                ></iframe>
              </div>
            </template>
          </li>
        </template>
      </ul>

      <p x-show="tracks.length === 0" class="text-center text-neutral-400">No tracks found for this artist.</p>

      <button
        type="button"
        x-show="hasMoreTracks"
        class="btn-secondary"
        :disabled="loadingMore"
        @click="loadMoreTracks()"
        x-text="loadingMore ? 'Loading…' : 'Load more songs'"
      ></button>
    </div>
  </template>

  <script type="module">
    import { api } from '/app.js';
    import { mountHeader, mountNav } from '/nav.js';
    import { requireAuth } from '/auth.js';
    import { checkPlayerAvailability, playTrack, pausePlayback, resumePlayback, onStateChange } from '/wavelengthzPlayer.js';
    mountHeader();
    mountNav();

    // Matches src/routes/catalog.ts's ARTIST_PROFILE_TRACK_LIMIT -- the
    // server default this page starts at, and the increment each "Load
    // more" tap adds on top of it.
    const TRACKS_PAGE_SIZE = 30;

    window.artistApp = function () {
      return {
        artistId: new URLSearchParams(window.location.search).get('id'),
        artist: null,
        tracks: [],
        error: null,
        // Which track's player row is expanded, custom or iframe either way
        // -- see customPlayerAvailable below for which one actually renders.
        openTrackId: null,
        trackLimit: TRACKS_PAGE_SIZE,
        hasMoreTracks: false,
        loadingMore: false,
        // Set once at init from wavelengthzPlayer.js's own Premium +
        // `streaming`-scope check. False (Free tier, or not yet re-
        // authorized since that scope was added) means every track on this
        // page falls back to the same open.spotify.com/embed iframe it
        // always used -- see src/index.ts's CSP comment for why this can't
        // just always be attempted.
        customPlayerAvailable: false,
        // The open track's live position/duration/paused state, from the
        // Wavelengthz Player's own player_state_changed event. Only
        // meaningful while customPlayerAvailable is true.
        playerState: null,

        get progressPct() {
          if (!this.playerState || !this.playerState.duration) return 0;
          return (this.playerState.position / this.playerState.duration) * 100;
        },

        async init() {
          if (!(await requireAuth())) return;
          try {
            const res = await api.artistProfile(this.artistId);
            this.artist = res.artist;
            this.tracks = res.tracks;
            this.hasMoreTracks = res.hasMore;
          } catch (e) {
            this.error = 'Could not load this artist. Please try again.';
          }

          const availability = await checkPlayerAvailability();
          this.customPlayerAvailable = availability.available;
          if (this.customPlayerAvailable) {
            onStateChange((state) => {
              // Ignore state for a track other than the one actually open on
              // this page -- state comes from the page's one shared Connect
              // device, so a stale event for whatever played previously
              // shouldn't reopen/repopulate a since-closed row.
              const openTrack = this.tracks.find((t) => t.id === this.openTrackId);
              if (!openTrack || !state || state.track_window?.current_track?.id !== openTrack.spotifyId) return;
              this.playerState = { paused: state.paused, position: state.position, duration: state.duration };
            });
          }
        },

        async togglePlayPause() {
          if (!this.playerState) return;
          if (this.playerState.paused) await resumePlayback();
          else await pausePlayback();
        },

        // GET /api/artists/:id has no offset/cursor to resume from
        // (fetchArtistTracks re-derives the list from scratch each call), so
        // this re-fetches the whole thing at a higher limit rather than
        // appending an incremental page.
        async loadMoreTracks() {
          if (this.loadingMore || !this.hasMoreTracks) return;
          this.loadingMore = true;
          this.error = null;
          const nextLimit = this.trackLimit + TRACKS_PAGE_SIZE;
          try {
            const res = await api.artistProfile(this.artistId, nextLimit);
            this.trackLimit = nextLimit;
            this.tracks = res.tracks;
            this.hasMoreTracks = res.hasMore;
          } catch (e) {
            this.error = 'Could not load more songs. Please try again.';
          } finally {
            this.loadingMore = false;
          }
        },

        async togglePlayer(track) {
          if (this.openTrackId === track.id) {
            if (this.customPlayerAvailable) await pausePlayback();
            this.openTrackId = null;
            this.playerState = null;
            return;
          }
          this.openTrackId = track.id;
          this.playerState = null;
          if (!this.customPlayerAvailable) return; // the iframe template handles itself
          const started = await playTrack(track.spotifyId);
          if (!started) {
            // Failed at the actual play call despite passing the earlier
            // availability check (a transient Spotify/network hiccup, most
            // likely) -- degrade to the iframe for the rest of this page
            // view instead of leaving the row stuck on a player that never
            // starts.
            this.customPlayerAvailable = false;
          }
        },

        async swipeTrack(track, direction) {
          this.error = null;
          const previous = track.direction;
          track.direction = direction; // optimistic
          try {
            await api.swipe('music', { item_type: 'track', item_id: track.id, direction });
          } catch (e) {
            track.direction = previous;
            this.error = 'Could not save that. Please try again.';
          }
        },
      };
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <div id="wl-nav-root"></div>
</body>
</html>
