<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Artist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 pb-app">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()" x-init="init()">

  <p x-show="error" x-text="error" class="mx-auto mb-4 max-w-md text-red-400" role="alert"></p>

  <template x-if="artist">
    <div class="mx-auto flex max-w-md flex-col gap-6">
      <div class="flex items-center gap-4">
        <img :src="artist.imageUrl" :alt="artist.name" class="h-20 w-20 rounded-full object-cover ring-1 ring-white/10" />
        <div>
          <h1 class="text-2xl font-bold" x-text="artist.name"></h1>
          <div class="mt-1 flex flex-wrap gap-1" x-show="artist.genres.length > 0">
            <template x-for="g in artist.genres" :key="g">
              <span class="pill-toggle pill-toggle-inactive px-2 py-0.5 text-xs" x-text="g"></span>
            </template>
          </div>
          <p class="mt-1 text-sm text-neutral-400">
            <span x-text="artist.totalLikes"></span> like<span x-show="artist.totalLikes !== 1">s</span>
            · <span x-text="artist.totalLikesInArea"></span> in your area
          </p>
        </div>
      </div>

      <ul class="flex flex-col gap-2">
        <template x-for="track in tracks" :key="track.id">
          <li class="card flex flex-col gap-3 p-3">
            <div class="flex items-center gap-3">
              <img :src="track.imageUrl" :alt="track.name" class="h-12 w-12 rounded object-cover ring-1 ring-white/10" />
              <p class="min-w-0 flex-1 truncate text-sm text-neutral-100" x-text="track.name"></p>
              <!-- Playback happens in the fixed player bar
                   (public/playerBar.js) above the bottom nav, not inline
                   here -- this button just hands off to it and reflects
                   whether this row is the one currently playing there. -->
              <button
                class="btn-ghost h-9 w-9 rounded-full"
                @click="togglePlayer(track)"
                :aria-label="isCurrentTrack(track.spotifyId) ? 'Pause' : 'Play'"
              >
                <svg x-show="!isCurrentTrack(track.spotifyId)" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-5 w-5">
                  <path d="M8 5v14l11-7z" />
                </svg>
                <svg x-show="isCurrentTrack(track.spotifyId)" viewBox="0 0 24 24" fill="currentColor" class="mx-auto h-5 w-5">
                  <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
                </svg>
              </button>
              <button
                class="btn-secondary h-9 w-9 rounded-full text-sm"
                :class="track.direction === 'left' ? 'ring-2 ring-neutral-400' : ''"
                @click="swipeTrack(track, 'left')"
                aria-label="Pass"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto h-4 w-4">
                  <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17" />
                </svg>
              </button>
              <button
                class="btn-primary h-9 w-9 rounded-full text-sm"
                :class="track.direction === 'right' ? 'ring-2 ring-white' : ''"
                @click="swipeTrack(track, 'right')"
                aria-label="Like"
              >♥</button>
            </div>
          </li>
        </template>
      </ul>

      <p x-show="tracks.length === 0" class="text-center text-neutral-400">No tracks found for this artist.</p>

      <button
        type="button"
        x-show="hasMoreTracks"
        class="btn-secondary"
        :disabled="loadingMore"
        @click="loadMoreTracks()"
        x-text="loadingMore ? 'Loading…' : 'Load more songs'"
      ></button>
    </div>
  </template>
  </div>

  <script type="module">
    import { mountHeader, mountNav } from '/nav.js';
    import { createArtistApp } from '/artist.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    mountPlayerBar();

    window.pageApp = createArtistApp;
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="fixed inset-x-0 z-10" style="bottom: var(--wl-nav-h)">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
