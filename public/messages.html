<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 flex flex-col" x-data="messagesApp()" x-init="init()">
  <div id="wl-header-root"></div>
  <p x-show="error" x-text="error" class="text-red-400 max-w-md w-full mx-auto mb-2" role="alert"></p>
  <ul class="flex-1 flex flex-col gap-2 overflow-y-auto max-w-md w-full mx-auto">
    <template x-for="message in messages" :key="message.id">
      <li class="card px-3 py-2" x-text="message.body"></li>
    </template>
  </ul>
  <form class="flex gap-2 max-w-md w-full mx-auto mt-4 mb-20" @submit.prevent="send()">
    <label class="sr-only" for="message-input">Message</label>
    <input id="message-input" class="field flex-1" x-model="draft" required />
    <button type="submit" class="btn-primary px-5">Send</button>
  </form>

  <script type="module">
    import { api } from '/app.js';
    import { mountHeader, mountNav } from '/nav.js';
    import { requireAuth } from '/auth.js';
    mountHeader();
    mountNav();

    window.messagesApp = function () {
      return {
        matchId: new URLSearchParams(window.location.search).get('matchId'),
        messages: [],
        draft: '',
        error: null,
        async init() {
          if (!(await requireAuth())) return;
          this.load();
        },
        async load() {
          this.error = null;
          try {
            const res = await api.messages(this.matchId);
            this.messages = res.messages;
          } catch (e) {
            this.error = 'Could not load messages. Please try again.';
          }
        },
        async send() {
          if (!this.draft.trim()) return;
          this.error = null;
          try {
            await api.sendMessage(this.matchId, this.draft);
            this.draft = '';
            await this.load();
          } catch (e) {
            this.error = 'Could not send that message. Please try again.';
          }
        },
      };
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <div id="wl-nav-root"></div>
</body>
</html>
