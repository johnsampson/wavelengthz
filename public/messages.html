<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wavelengthz — Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tailwind.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="https://img.wavelengthz.com/wavelengthz-logo-transparent.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body class="min-h-screen bg-base text-neutral-50 p-4 flex flex-col">
  <div id="wl-header-root"></div>
  <div id="wl-app-root" x-data="pageApp()" x-init="init()" class="flex flex-1 flex-col min-h-0">
  <p x-show="error" x-text="error" class="text-red-400 max-w-md w-full mx-auto mb-2" role="alert"></p>
  <ul id="message-list" class="flex-1 flex flex-col gap-2 overflow-y-auto max-w-md w-full mx-auto">
    <template x-for="message in messages" :key="message.id">
      <li class="flex flex-col" :class="message.sender_id === myId ? 'items-end' : 'items-start'">
        <span class="mb-0.5 text-xs text-neutral-500" x-text="message.sender_id === myId ? 'You' : otherName"></span>
        <p
          x-show="!message.recalledAt"
          class="card max-w-[80%] px-3 py-2"
          :class="message.sender_id === myId ? 'bg-brand-500 text-white' : ''"
          x-text="message.body"
        ></p>
        <p x-show="message.recalledAt" class="card max-w-[80%] px-3 py-2 italic text-neutral-500" x-text="message.sender_id === myId ? 'You recalled this message' : 'Message recalled'"></p>
        <button
          type="button"
          class="mt-0.5 text-xs text-neutral-500 underline"
          x-show="canRecall(message)"
          @click="recall(message)"
        >Recall</button>
      </li>
    </template>
  </ul>
  <form class="flex gap-2 max-w-md w-full mx-auto mt-4 mb-app" @submit.prevent="send()">
    <label class="sr-only" for="message-input">Message</label>
    <input id="message-input" class="field flex-1" x-model="draft" maxlength="2000" required />
    <button type="submit" class="btn-primary px-5">Send</button>
  </form>
  </div>

  <script type="module">
    import { mountHeader, mountNav } from '/nav.js';
    import { createMessagesApp } from '/messages.js';
    import { mountPlayerBar } from '/playerBar.js';
    import '/router.js';
    mountHeader();
    mountNav();
    mountPlayerBar();

    window.pageApp = createMessagesApp;
  </script>
  <script defer src="/alpine.js"></script>
  <!-- Fixed above the bottom nav, filled in by playerBar.js's mountPlayerBar()
       -- see its own comment for why the two sub-containers are split and
       never innerHTML'd together. Empty (0-height) until something plays. -->
  <div id="wl-player-root" class="fixed inset-x-0 z-10" style="bottom: var(--wl-nav-h)">
    <div id="wl-player-chrome" class="border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
    <div id="wl-player-iframe-host" class="hidden border-t border-white/10 bg-surface/90 backdrop-blur-lg"></div>
  </div>
  <div id="wl-nav-root"></div>
</body>
</html>
